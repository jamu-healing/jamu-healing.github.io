<article class="blog-card bg-gray-800 rounded-2xl overflow-hidden shadow-lg">
  {% if post.image %}
  <a href="{{ post.url }}">
    <img src="{{ post.image }}" alt="{{ post.title }}" class="w-full h-48 object-cover">
  </a>
  {% endif %}
  
  <div class="p-6">
    <!-- Date and Tags -->
    <div class="flex flex-wrap items-center gap-2 text-sm text-gray-400 mb-3">
      <time datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%B %d, %Y" }}
      </time>
      {% if post.tags.size > 0 %}
        <span>•</span>
        {% for tag in post.tags limit:2 %}
          <span class="bg-gray-700 px-2 py-1 rounded-full text-xs">{{ tag }}</span>
        {% endfor %}
      {% endif %}
    </div>
    
    <!-- Title -->
    <h3 class="text-xl font-bold mb-3">
      <a href="{{ post.url }}" class="hover:text-purple-400 transition">
        {{ post.title }}
      </a>
    </h3>
    
    <!-- Excerpt -->
    <p class="text-gray-400 mb-4 line-clamp-3">
      {{ post.excerpt | strip_html | truncatewords: 30 }}
    </p>
    
    <!-- Read More -->
    <a href="{{ post.url }}" class="inline-flex items-center gap-2 text-purple-400 hover:text-purple-300 transition font-semibold">
      Read More
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
      </svg>
    </a>
  </div>
</article>
