<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
{% if page.url contains '/4-70-16/' %}
<link rel="stylesheet" href="{{ '/css/private.css' | relative_url }}">
{% endif %}

<!-- Favicon -->
<link rel="icon" type="image/png" href="/images/favicon.png">

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% endif %}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">

<!-- RSS Feed -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Schema.org JSON-LD -->
{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "{{ page.author | default: 'Evi Sudarto' }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Jamu Healing"
  },
  "description": "{{ page.excerpt | strip_html | truncatewords: 30 }}",
  {% if page.image %}
  "image": "{{ page.image | absolute_url }}",
  {% endif %}
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
{% elsif page.layout == 'service' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": "{{ page.title }}",
  "provider": {
    "@type": "LocalBusiness",
    "name": "Jamu Healing",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Jl. Blong Keker",
      "addressLocality": "Jimbaran",
      "addressRegion": "Bali",
      "addressCountry": "ID"
    },
    "telephone": "+62-857-3886-7684"
  },
  "description": "{{ page.description | default: page.excerpt | strip_html }}"
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Jamu Healing",
  "description": "Traditional Javanese Medicine by Evi Sudarto",
  "url": "{{ '/' | absolute_url }}",
  "telephone": "+62-857-3886-7684",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Jl. Blong Keker",
    "addressLocality": "Jimbaran",
    "addressRegion": "Bali",
    "addressCountry": "ID"
  },
  "sameAs": [
    "https://www.instagram.com/healerdewi/",
    "https://www.facebook.com/Jamu.Healing/",
    "https://www.youtube.com/@osteopathbali",
    "https://t.me/jamu_healing"
  ]
}
</script>
{% endif %}
