<!-- ═══ HEADER ══════════════════════════════════════════════ -->
<header class="site-header" id="siteHeader">
  <div class="container">
    <nav class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/images/logo.webp" alt="Jamu Healing" />
        <div class="nav-logo-text">
          <span class="nav-logo-title">Jamu Healing</span>
          <span class="nav-logo-sub">by Evi Sudarto</span>
        </div>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <i class="bi bi-chevron-down"></i>
        <i class="bi bi-chevron-down"></i>
      </button>
    </nav>
  </div>
  <div class="nav-dropdown" id="navDropdown">
    <ul>
      <li><a href="/" {% if page.url == '/' %}class="active"{% endif %}><i class="bi bi-house"></i> Home</a></li>
      <li><a href="/blog/" {% if page.url contains '/blog' %}class="active"{% endif %}><i class="bi bi-journal-text"></i> Blog</a></li>
      <li><a href="/pages/about/" {% if page.url contains '/about' %}class="active"{% endif %}><i class="bi bi-person"></i> About</a></li>
      <li><a href="/pages/services/" {% if page.url contains '/services' %}class="active"{% endif %}><i class="bi bi-heart-pulse"></i> Services</a></li>
      <li><a href="/pages/contacts/" {% if page.url contains '/contacts' %}class="active"{% endif %}><i class="bi bi-envelope"></i> Contacts</a></li>
      {% if page.lang == 'ru' %}
        <li><a href="{{ page.url | remove: '/ru' }}"><i class="bi bi-translate"></i> EN</a></li>
      {% else %}
        <li><a href="/ru{{ page.url }}"><i class="bi bi-translate"></i> RU</a></li>
      {% endif %}
    </ul>
  </div>
</header>
<script>
  (function(){
    var btn = document.getElementById('navToggle');
    var dd  = document.getElementById('navDropdown');
    btn.addEventListener('click', function(){
      var open = dd.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function(e){
      if (!document.getElementById('siteHeader').contains(e.target)) {
        dd.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', false);
      }
    });
  })();
</script>
