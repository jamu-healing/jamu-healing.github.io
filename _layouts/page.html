---
layout: default
---
<article class="py-16">
  <div class="container mx-auto px-4">
    <!-- Breadcrumb -->
    <nav class="mb-8 text-sm">
      <a href="/" class="text-gray-400 hover:text-white">Home</a>
      <span class="mx-2 text-gray-600">/</span>
      <span class="text-purple-400">{{ page.title }}</span>
    </nav>
    
    <!-- Page Title -->
    <h1 class="text-4xl md:text-5xl font-bold mb-8">{{ page.title }}</h1>
    
    <!-- Page Content -->
    <div class="prose prose-invert max-w-none">
      {{ content }}
    </div>
  </div>
</article>
