## Search Posts

<div class="search-box mb-8">
  <div class="relative">
    <input 
      type="text" 
      id="search-input" 
      placeholder="Search posts..." 
      class="w-full p-4 pl-12 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 transition"
    >
    <svg class="w-5 h-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
  </div>
</div>

<div id="search-results" class="space-y-4"></div>

<script>
(function() {
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  
  if (!searchInput || !searchResults) return;
  
  const posts = [
    {% for post in site.posts %}
    {
      "title": "{{ post.title | escape }}",
      "url": "{{ post.url | relative_url }}",
      "date": "{{ post.date | date: '%B %d, %Y' }}",
      "excerpt": "{{ post.excerpt | strip_html | truncatewords: 20 | escape }}",
      "tags": "{{ post.tags | join: ', ' }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  
  searchInput.addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();
    
    if (query.length < 2) {
      searchResults.innerHTML = '';
      return;
    }
    
    const results = posts.filter(post => 
      post.title.toLowerCase().includes(query) || 
      post.excerpt.toLowerCase().includes(query) ||
      post.tags.toLowerCase().includes(query)
    );
    
    if (results.length === 0) {
      searchResults.innerHTML = '<p class="text-gray-400">No posts found matching your search.</p>';
      return;
    }
    
    searchResults.innerHTML = results.map(post => `
      <article class="p-4 bg-gray-800 rounded-xl hover:bg-gray-750 transition">
        <h3 class="font-bold mb-1">
          <a href="${post.url}" class="hover:text-purple-400 transition">${post.title}</a>
        </h3>
        <time class="text-sm text-gray-400">${post.date}</time>
        <p class="mt-2 text-gray-400 text-sm">${post.excerpt}</p>
      </article>
    `).join('');
  });
})();
</script>
